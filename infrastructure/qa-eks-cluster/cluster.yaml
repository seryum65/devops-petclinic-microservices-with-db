apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: petclinic-cluster
  region: eu-north-1
availabilityZones: ["eu-north-1a", "eu-north-1b", "eu-north-1c"]
managedNodeGroups:
  - name: ng-1
    instanceType: c7i-flex.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
      