---
# Amazon Linux 2023 (ec2-user) için hazırlanmıştır. apt yerine dnf kullanır.
- hosts: all
  become: true
  tasks:

  - name: change hostnames
    shell: "hostnamectl set-hostname {{ hostvars[inventory_hostname]['private_dns_name'] }}"

  - name: Load kernel modules required by Kubernetes
    shell: |
      cat > /etc/modules-load.d/k8s.conf <<'EOF'
      overlay
      br_netfilter
      EOF
      modprobe overlay
      modprobe br_netfilter

  - name: Enable the nodes to see bridged traffic
    shell: |
      cat > /etc/sysctl.d/k8s.conf <<'EOF'
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1
      EOF
      sysctl --system

  - name: Disable swap
    shell: swapoff -a

  - name: Update all packages
    dnf:
      name: "*"
      state: latest
      update_cache: yes

  - name: Install required packages
    dnf:
      name:
        - iptables-nft
        - iproute-tc
        - socat
        - conntrack-tools
        - containerd
        - docker
      state: present

  - name: Add Kubernetes repository
    yum_repository:
      name: kubernetes
      description: Kubernetes
      baseurl: https://pkgs.k8s.io/core:/stable:/v1.28/rpm/
      gpgcheck: yes
      gpgkey: https://pkgs.k8s.io/core:/stable:/v1.28/rpm/repodata/repomd.xml.key
      exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni
      enabled: yes

  - name: Install kubelet, kubeadm and kubectl
    dnf:
      name:
        - kubelet
        - kubeadm
        - kubectl
      state: present
      disable_excludes: kubernetes

  - name: Enable kubelet
    service:
      name: kubelet
      enabled: yes

  - name: Add ec2-user to docker group
    user:
      name: ec2-user
      groups: docker
      append: yes

  - name: Restart docker and enable
    service:
      name: docker
      state: restarted
      enabled: yes

  # containerd'in cgroup driver'ını systemd yap, sonra containerd'i yeniden başlat
  - name: change the containerd cgroup driver
    shell: |
      mkdir -p /etc/containerd
      containerd config default | tee /etc/containerd/config.toml >/dev/null 2>&1
      sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml

  - name: Restart containerd and enable
    service:
      name: containerd
      state: restarted
      enabled: yes


- hosts: role_master
  tasks:

  - name: pull kubernetes images before installation
    become: yes
    shell: kubeadm config images pull

  - name: initialize the Kubernetes cluster using kubeadm
    become: true
    shell: |
      kubeadm init --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=All
    args:
      creates: /etc/kubernetes/admin.conf

  - name: Setup kubeconfig for ec2-user
    become: true
    command: "{{ item }}"
    with_items:
     - mkdir -p /home/ec2-user/.kube
     - cp -f /etc/kubernetes/admin.conf /home/ec2-user/.kube/config
     - chown ec2-user:ec2-user /home/ec2-user/.kube/config

  - name: Install flannel pod network
    remote_user: ec2-user
    shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

  - name: Generate join command
    become: true
    command: kubeadm token create --print-join-command
    register: join_command_for_workers

  - debug: msg='{{ join_command_for_workers.stdout.strip() }}'

  - name: register join command for workers
    add_host:
      name: "kube_master"
      worker_join: "{{ join_command_for_workers.stdout.strip() }}"

  - name: install Helm
    shell: |
      cd /home/ec2-user
      curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
      chmod 700 get_helm.sh
      ./get_helm.sh

- hosts: role_worker
  become: true
  tasks:

  - name: Join workers to cluster
    shell: "{{ hostvars['kube_master']['worker_join'] }}"
    register: result_of_joining

  - debug: msg='{{ result_of_joining.stdout }}'